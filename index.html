<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câmara Aberta SJC</title>
  <meta name="description" content="Protótipo que mostra, em linguagem simples, como a Câmara Municipal de São José dos Campos gasta dinheiro. Dados simulados.">
  <meta name="theme-color" content="#1F2A44">
  <link rel="stylesheet" href="css/estilo.css">
  <!-- Ícones Lucide (versão fixa, para o site não mudar sozinho) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Gráficos Chart.js (versão fixa) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <!-- Aviso fixo exigido: aparece em todas as telas -->
  <div class="aviso" role="note">
    <i data-lucide="triangle-alert" aria-hidden="true"></i>
    <p>Protótipo independente com dados simulados. Não é um sistema oficial.</p>
    <button class="ajuda" type="button" data-ajuda="dados-simulados" aria-label="O que são dados simulados?">
      <i data-lucide="circle-help" aria-hidden="true"></i>
    </button>
  </div>

  <header class="topo">
    <i data-lucide="landmark" aria-hidden="true"></i>
    <span>Câmara Aberta SJC</span>
  </header>

  <!-- O conteúdo de cada tela é colocado aqui pelo js/app.js -->
  <main id="conteudo" tabindex="-1">
    <p class="carregando">Carregando dados…</p>
  </main>

  <!-- Janela de ajuda: preenchida e aberta pelo js/app.js -->
  <dialog id="janela-ajuda" aria-labelledby="ajuda-titulo">
    <div class="ajuda-cabecalho">
      <h2 id="ajuda-titulo"></h2>
      <button type="button" class="fechar" aria-label="Fechar explicação">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>
    <div id="ajuda-texto"></div>
    <button type="button" class="botao fechar">Entendi</button>
  </dialog>

  <nav class="abas" aria-label="Seções">
    <a href="#/inicio" data-aba="inicio">
      <i data-lucide="house" aria-hidden="true"></i><span>Início</span>
    </a>
    <a href="#/graficos" data-aba="graficos">
      <i data-lucide="chart-pie" aria-hidden="true"></i><span>Gráficos</span>
    </a>
    <a href="#/gabinetes" data-aba="gabinetes">
      <i data-lucide="users" aria-hidden="true"></i><span>Gabinetes</span>
    </a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
